<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Runner Game</title>
    <style>
        /* मोबाइल स्क्रीन जैसा डिज़ाइन */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            width: 360px;
            height: 640px;
            background-color: #87CEEB; /* आसमान का रंग */
            position: relative;
            border: 4px solid #34495e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* टॉप बार (Menu और Coin) */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
        }

        .menu-btn {
            background: #fff;
            color: #000;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .coin-box {
            background: #f1c40f;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 3D कैरेक्टर की जगह */
        #character-area {
            height: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #dummy-3d-model {
            font-size: 80px;
            animation: bounce 2s infinite;
        }

        /* एमोट टेक्स्ट */
        .emote-text {
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Play बटन (सबसे नीचे) */
        #bottom-bar {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }

        #play-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #2ecc71;
            transition: 0.2s;
        }

        #play-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #2ecc71;
        }

        /* ≡ More वाला मेनू (Store) */
        #side-menu {
            position: absolute;
            top: 0;
            left: -100%;
            width: 70%;
            height: 100%;
            background: #34495e;
            transition: 0.3s;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        #side-menu.open {
            left: 0;
        }

        .close-btn {
            color: red;
            float: right;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
        }

        .shop-item {
            background: #ecf0f1;
            color: #000;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* कैरेक्टर एनिमेशन (एमोट दिखाने के लिए) */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- साइड मेनू (स्टोर) -->
        <div id="side-menu">
            <span class="close-btn" onclick="toggleMenu()">X Close</span>
            <h2 style="color: white; margin-top: 0;">Store 🛒</h2>
            <div class="shop-item">👕 Buy Clothes (Watch Ad)</div>
            <div class="shop-item">🕺 Buy Emotes (500 Coins)</div>
        </div>

        <!-- टॉप बार -->
        <div id="top-bar">
            <div class="menu-btn" onclick="toggleMenu()">≡ More</div>
            <div class="coin-box">🟡 <span id="coin-count">0</span></div>
        </div>

        <!-- 3D कैरेक्टर एरिया -->
        <div id="character-area">
            <div id="dummy-3d-model">🧍</div>
            <div class="emote-text">यहाँ 3D Model खड़ा रहेगा और Emote करेगा</div>
        </div>

        <!-- प्ले बटन -->
        <div id="bottom-bar">
            <button id="play-btn" onclick="startGame()">PLAY</button>
        </div>

    </div>

    <script>
        // मेनू खोलने और बंद करने का लॉजिक
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
            } else {
                menu.classList.add('open');
            }
        }

        // गेम स्टार्ट करने का लॉजिक
        function startGame() {
            alert("गेम शुरू हो रहा है! 3D रनिंग सिस्टम लोड हो रहा है...");
            // आगे चलकर यहाँ हम कार से बचने वाला लॉजिक जोड़ेंगे
        }
    </script>

</body>
</html>
