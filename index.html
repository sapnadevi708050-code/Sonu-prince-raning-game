<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Runner Game</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: Arial, sans-serif;
            background-color: #2c3e50; display: flex; justify-content: center;
            align-items: center; height: 100vh; color: white; overflow: hidden;
        }

        #game-container {
            width: 360px; height: 640px; background-color: #87CEEB;
            position: relative; border: 4px solid #34495e; border-radius: 15px;
            overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* --- LOBBY UI --- */
        #lobby-ui { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; }
        #top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(0, 0, 0, 0.4); align-items: center; }
        .menu-btn { background: #fff; color: #000; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .coin-box { background: #f1c40f; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        #character-area { height: 60%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #dummy-3d-model { font-size: 80px; animation: bounce 2s infinite; }
        .emote-text { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 10px; margin-top: 10px; font-size: 14px; }
        #bottom-bar { position: absolute; bottom: 30px; width: 100%; text-align: center; }
        #play-btn { background: #27ae60; color: white; border: none; padding: 15px 50px; font-size: 24px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0 #2ecc71; }
        #play-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #2ecc71; }
        
        #side-menu { position: absolute; top: 0; left: -100%; width: 70%; height: 100%; background: #34495e; transition: 0.3s; padding: 20px; box-sizing: border-box; z-index: 10; }
        #side-menu.open { left: 0; }
        .close-btn { color: red; float: right; cursor: pointer; font-weight: bold; font-size: 20px; }
        .shop-item { background: #ecf0f1; color: #000; margin-top: 15px; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- GAME PLAY UI --- */
        #game-play-area {
            width: 100%; height: 100%; background-color: #555; position: absolute; top: 0; left: 0; display: none; z-index: 4;
        }

        /* चलती हुई सड़क */
        .road-stripes {
            width: 15px; height: 1000%; background: repeating-linear-gradient(to bottom, white 0, white 50px, transparent 50px, transparent 100px);
            position: absolute; left: 50%; transform: translateX(-50%); top: -900%;
            animation: roadMove 2s linear infinite;
        }
        @keyframes roadMove { 100% { top: 0; } }

        /* प्लेयर (हमारा कैरेक्टर) */
        #player {
            font-size: 50px; position: absolute; bottom: 20px; left: 155px; /* बीच में */
            transition: left 0.1s;
        }

        /* दुश्मन कारें */
        .enemy-car {
            width: 50px; height: 80px; background-color: #e74c3c; border-radius: 10px;
            position: absolute; top: -100px;
        }

        /* लाइव स्कोर */
        #score-board {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
            color: white; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 18px;
        }

        /* मोबाइल कंट्रोल्स (स्क्रीन के दो हिस्से) */
        #controls { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; z-index: 10; }
        .control-half { width: 50%; height: 100%; }

        /* गेम ओवर स्क्रीन */
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 10px;
            text-align: center; display: none; z-index: 20; width: 80%;
        }
        #restart-btn { background: #3498db; color: white; border: none; padding: 10px 20px; margin-top: 15px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- लॉबी -->
        <div id="lobby-ui">
            <div id="side-menu">
                <span class="close-btn" onclick="toggleMenu()">X Close</span>
                <h2 style="color: white; margin-top: 0;">Store 🛒</h2>
                <div class="shop-item">👕 Buy Clothes (Ad)</div>
                <div class="shop-item">🕺 Buy Emotes</div>
            </div>
            <div id="top-bar">
                <div class="menu-btn" onclick="toggleMenu()">≡ More</div>
                <div class="coin-box">🟡 <span id="lobby-coins">0</span></div>
            </div>
            <div id="character-area">
                <div id="dummy-3d-model">🧍</div>
                <div class="emote-text">Ready to Run!</div>
            </div>
            <div id="bottom-bar">
                <button id="play-btn" onclick="startGame()">PLAY</button>
            </div>
        </div>

        <!-- गेम प्ले एरिया -->
        <div id="game-play-area">
            <div class="road-stripes"></div>
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="player">🧍</div>
            
            <!-- टच कंट्रोल्स -->
            <div id="controls">
                <div class="control-half" onclick="movePlayer('left')"></div>
                <div class="control-half" onclick="movePlayer('right')"></div>
            </div>
        </div>

        <!-- गेम ओवर -->
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="location.reload()">Back to Lobby</button>
        </div>

    </div>

    <script>
        let isGameRunning = false;
        let score = 0;
        let player = document.getElementById('player');
        let gameArea = document.getElementById('game-play-area');
        let scoreText = document.getElementById('score');
        
        // प्लेयर की पोजीशन (तीन लेन: Left, Center, Right)
        let playerX = 155; 
        
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            menu.classList.toggle('open');
        }

        // गेम स्टार्ट करने का फंक्शन
        function startGame() {
            document.getElementById('lobby-ui').style.display = 'none';
            document.getElementById('game-play-area').style.display = 'block';
            isGameRunning = true;
            score = 0;
            spawnEnemies();
            updateScore();
        }

        // मोबाइल के लिए लेफ्ट-राइट मूवमेंट
        function movePlayer(direction) {
            if (!isGameRunning) return;
            if (direction === 'left' && playerX > 50) {
                playerX -= 100; // बायीं लेन में जाएँ
            } else if (direction === 'right' && playerX < 250) {
                playerX += 100; // दायीं लेन में जाएँ
            }
            player.style.left = playerX + 'px';
        }

        // कीबोर्ड से खेलने के लिए (अगर कंप्यूटर पर टेस्ट कर रहे हैं)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') movePlayer('left');
            if (e.key === 'ArrowRight') movePlayer('right');
        });

        // दुश्मन कारें बनाने का लॉजिक
        function spawnEnemies() {
            if (!isGameRunning) return;

            let enemy = document.createElement('div');
            enemy.classList.add('enemy-car');
            
            // कार को 3 लेन में से किसी एक में रैंडम जगह से निकालें
            let lanes = [55, 155, 255]; 
            let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            enemy.style.left = randomLane + 'px';
            enemy.style.top = '-100px';
            
            gameArea.appendChild(enemy);

            let enemySpeed = 5;
            
            // कार को नीचे लाने का लूप
            let moveEnemy = setInterval(() => {
                if (!isGameRunning) {
                    clearInterval(moveEnemy);
                    return;
                }

                let enemyTop = parseInt(window.getComputedStyle(enemy).getPropertyValue('top'));
                enemy.style.top = (enemyTop + enemySpeed) + 'px';

                // कोलिजन (टकराने) का चेक
                let playerRect = player.getBoundingClientRect();
                let enemyRect = enemy.getBoundingClientRect();

                if (
                    playerRect.left < enemyRect.right &&
                    playerRect.right > enemyRect.left &&
                    playerRect.top < enemyRect.bottom &&
                    playerRect.bottom > enemyRect.top
                ) {
                    gameOver();
                    clearInterval(moveEnemy);
                }

                // कार स्क्रीन से बाहर चली जाए तो उसे डिलीट कर दें
                if (enemyTop > 640) {
                    enemy.remove();
                    clearInterval(moveEnemy);
                }
            }, 20);

            // हर 1.5 सेकंड में नई कार बनाएँ
            setTimeout(spawnEnemies, 1500);
        }

        // स्कोर बढ़ाने का लॉजिक
        function updateScore() {
            if (!isGameRunning) return;
            score += 1;
            scoreText.innerText = score;
            setTimeout(updateScore, 500);
        }

        // गेम ओवर लॉजिक
        function gameOver() {
            isGameRunning = false;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            // सारी गाड़ियां रोक दें
            document.querySelectorAll('.enemy-car').forEach(car => car.remove());
        }
    </script>
</body>
</html>
